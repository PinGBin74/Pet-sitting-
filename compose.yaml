name: petsitting

services:
  api:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-dev}
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://petsitting:petsitting@db:5432/petsitting
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: petsitting
      POSTGRES_PASSWORD: petsitting
      POSTGRES_DB: petsitting
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petsitting -d petsitting"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    # Порт наружу не публикуется: сервис обращается к базе по внутренней сети
    # по имени db. Для запуска сервиса через uv run или подключения клиентом
    # раскомментируйте строки ниже; если порт 5432 занят, смените левую часть.
    # ports:
    #   - "127.0.0.1:5432:5432"

volumes:
  pgdata:
